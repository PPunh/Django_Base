{% load humanize %}
<div id="poInModal" class="w3-modal">
    <div class="w3-modal-content w3-card-4 w3-animate-zoom" style="max-width: 600px;">
        <div class="w3-container w3-blue">
            <h3>Create PO In</h3>
            <span onclick="closeModal('poInModal')" class="w3-button w3-display-topright">&times;</span>
        </div>
        <form method="post" action="{% url 'po:create' %}">
            {% csrf_token %}
            <div class="w3-padding">
                {{ po_form.as_p }}
                <button type="submit" class="w3-button w3-blue w3-round">Create</button>
                <button type="button" onclick="closeModal('poInModal')" class="w3-button w3-red w3-round">Cancel</button>
            </div>
        </form>
    </div>
</div>
