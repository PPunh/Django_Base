{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}
<div class="w3-bar-item" style="padding: 0 10px;">
    <form action="{% url 'set_language' %}" method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <select name="language" onchange="this.form.submit()"
            class="lang-select tvs-input w3-border w3-round w3-padding-small w3-text-grey"
            style="padding: 6px 12px; height: 38px; width: auto; font-size: 0.85rem;"
            aria-label="{% translate 'Language' %}">
            <option value="en" {% if LANGUAGE_CODE == 'en' %}selected{% endif %}>🇬🇧 EN</option>
            <option value="lo" {% if LANGUAGE_CODE == 'lo' %}selected{% endif %}>🇱🇦 ລາວ</option>
        </select>
    </form>
</div>
